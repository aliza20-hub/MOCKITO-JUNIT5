# ---------------------------------------------------
# Campus Resource & Complaint Management System
# NIT Srinagar - application configuration
# ---------------------------------------------------

spring.application.name=complaint-desk

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/campus_complaint_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=8080

# --- JWT ---
# NOTE: change this secret before deploying anywhere real. this is a dev-only key.
app.jwt.secret=nitSrinagarComplaintDeskSuperSecretKeyChangeThisInProd123456
app.jwt.expiration-ms=86400000

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.nitsri.complaintdesk=DEBUG
